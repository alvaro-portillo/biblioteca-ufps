spring.application.name=prestamos
server.port=8092

# Base de datos propia de este servicio (en memoria)
spring.datasource.url=jdbc:h2:mem:prestamos
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Mostrar el mensaje de error en las respuestas
server.error.include-message=always
libros.url=http://localhost:8091